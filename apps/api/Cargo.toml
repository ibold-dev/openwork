[package]
name = "openwork-api"
version = "0.1.0"
description = "OpenWork HTTP API and reconciliation worker"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "openwork_api"
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/bin/api.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1.89"
axum = "0.8.9"
base64 = "0.22.1"
borsh = "1.6.1"
bs58 = "0.5.1"
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15.7"
ed25519-dalek = "3.0.0"
hex = "0.4.3"
http = "1.4.0"
openwork-aurora = { workspace = true }
openwork-domain = { workspace = true }
rand = "0.8.5"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10.9"
solana-pubkey = { version = "3.0.0", features = ["curve25519"] }
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "json",
    "macros",
] }
thiserror = { workspace = true }
tokio = { version = "1.50", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.8", features = ["trace", "cors", "limit", "request-id", "timeout"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.23.0", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }
