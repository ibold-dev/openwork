name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SOLANA_VERSION: 2.3.11
  ANCHOR_VERSION: 1.1.2

jobs:
  program:
    name: Program and API (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Cache Solana and Anchor
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/solana
            ~/.local/share/solana
            ~/.local/bin/anchor
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}-${{ hashFiles('**/Cargo.lock', 'programs/**', 'crates/**', 'apps/api/**') }}

      - name: Install Solana CLI
        run: |
          # $GITHUB_PATH only affects later steps, so put the bin dir on PATH
          # here as well. Without this, `solana --version` below exits 127.
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          if ! command -v solana >/dev/null; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          solana --version

      - name: Install Anchor CLI
        run: |
          # Prebuilt release binary: compiling avm + anchor from source takes
          # several minutes on every cold cache.
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/anchor" \
            "https://github.com/coral-xyz/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/anchor" --version

      - name: Build program
        run: anchor build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Program tests (LiteSVM)
        run: cargo test -p openwork-escrow

      - name: API tests (in-memory store)
        run: cargo test -p openwork-api

  web:
    name: Web and SDK (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: IDL and discriminator drift
        run: node scripts/check-idl.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
