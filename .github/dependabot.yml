version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      solana:
        patterns:
          - 'solana-*'
          - 'anchor-*'
          - 'litesvm'
      patch-updates:
        update-types:
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      solana-kit:
        patterns:
          - '@solana/*'
      next-react:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
          - '@types/react*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
